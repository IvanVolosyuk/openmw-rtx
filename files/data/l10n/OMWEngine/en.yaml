LampSourceSizeValue: "Lamp source radius ({value}% of original)"
LampFlickerValue: "Flicker strength ({value}%)"
LampSpeedValue: "Animation speed ({value}%)"
LampMovementValue: "Flame movement ({value}%)"
LampBreathingValue: "Source size variation ({value}%)"
LampAnimationHint: "Applies immediately. Close the menu to see animation: lamps freeze while paused. Movement is independent of source radius."

RayTracingAntiFirefly: "Anti-firefly filter"
RayTracingAntiFireflyHint: "Suppresses sparkling indirect-light outliers. May dim genuine bounced light from glowing objects. Applies without restarting."

RayTracingIndirectLimitValue: "Indirect limit: {value}× white (0 = Off)"
RayTracingIndirectLimitHint: "Caps each indirect sample before averaging and denoising. White is linear brightness 1 after adapted exposure, before tone mapping. Lower values suppress sparks but can darken bounced light and reflections. Direct lighting is unchanged. Zero disables."

RayTracingDirectLampRays: "Direct lamp shadow rays"
RayTracingDirectLampRaysValue: "Direct lamp shadow rays ({value} a pixel)"
RayTracingDirectLampRaysHint: "Traces up to this many lamp shadow rays per pixel, ranked by actual delivered light so bright distant lamps and close lamps cast shadows together. Applies immediately."
RayTracingShadowDrawFloorValue: "Shadow draw floor ({value}%)"
RayTracingShadowDrawFloorHint: "Minimum light share required for a weak secondary sky or tail lamp source to draw its own shadow ray instead of riding the dominant shadow. Applies immediately."
RayTracingAmbientBrightnessValue: "Record ambient fill ({value}%, 0 = Off)"
RayTracingAmbientBrightnessHint: "Scales Morrowind's non-physical cell and weather ambient fill. Set to 0% to disable fake ambient completely so lighting comes purely from lamps, emissives, sky and bounced indirect light. Applies immediately."
LampReachValue: "Lamp illumination reach ({value}%)"
LampReachHint: "Scales how far lamps reach across rooms. Lower values (45% to 65%) keep lamps localized closer to their authored Morrowind radii so distant hall lamps do not wash out local shadows. Applies immediately."
EmptyLampBrightnessValue: "Invisible fill-lamp brightness ({value}%)"
EmptyLampBrightnessHint: "Scales placed room-fill lights that have no visible 3D mesh or flame emitter. 0% disables them completely; spell lights are unaffected. Applies immediately."
EmptyLampSourceSizeValue: "Invisible fill-lamp radius ({value}%)"
EmptyLampSourceSizeHint: "Widens the soft-shadow source radius of meshless room-fill lights so they do not cast sharp phantom shadows. Applies immediately."
RayTracingIndirectBrightnessValue: "Indirect bounce brightness ({value}%)"
RayTracingIndirectBrightnessHint: "Scales overall bounced diffuse indirect light. Lower values deepen shadows in bright rooms while preserving glossy reflections. Applies immediately."
RayTracingEmissiveBounceValue: "Emissive bounce brightness ({value}%)"
RayTracingEmissiveBounceHint: "Scales how strongly glowing emissive materials (such as illuminated interior window meshes) light nearby walls via bounced light, while keeping the glowing surfaces themselves bright on screen. Applies immediately."
LampFalloffValue: "Lamp falloff steepness ({value}%)"
LampFalloffHint: "Steepens lamp distance attenuation past the near zone (100% = physical inverse-square). Higher values (150% to 180%) prevent distant hall sconces from washing out local torch and sconce shadows, while powerful distant lamps still outrank dim close ones. Applies immediately."
